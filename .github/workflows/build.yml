name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8: Zielplattform (Gradle läuft selbst auf Java 8); 21: prüft, dass --release 8 Java-9+-APIs abweist.
        java: ['8', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
      - name: Build und Tests
        run: ./gradlew build --no-daemon --warning-mode all
