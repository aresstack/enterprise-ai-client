# Fat Jar der Swing-Anwendung bauen, prüfen und veröffentlichen.
#
#   main              -> Release-Version <projectVersion> aus gradle.properties: Tag v<version> plus GitHub-Release mit
#                        dem Jar, sofern das Tag noch nicht existiert (sonst nur Workflow-Artefakt und Warnung).
#   alle anderen      -> rollierender Snapshot <version>-SNAPSHOT: je Branch ein Pre-Release unter dem Tag
#   Branches             snapshot-<branch>-<hash>, dessen Tag und Jar jeder Push ersetzt; zusätzlich Workflow-Artefakt.
#   Branch gelöscht   -> Pre-Release und Tag des Branches werden entfernt.
#
# Snapshot-Tag: Branchname mit allen Zeichen außer [A-Za-z0-9._-] als '-' plus die ersten acht Hex-Zeichen von
# SHA-256 des unveränderten Branchnamens, damit Branches wie feature/foo und feature-foo getrennte Tags bekommen.
# Push-Job und Cleanup-Job teilen sich je Branch die Concurrency-Gruppe release-refs/heads/<branch>: ein Cleanup
# wartet, bis ein laufender Snapshot-Lauf fertig ist, und räumt dann auf; der Snapshot-Lauf prüft vor dem
# Veröffentlichen zusätzlich, ob der Branch noch existiert.
#
# Der Build läuft mit JDK 8 (Zielplattform) und umfasst alle Tests sowie verifyFatJar und smokeStartFatJar
# (gradle/fat-jar.gradle); veröffentlicht wird nur ein grün gebautes Jar. build.yml bleibt der Pull-Request-Check
# auf JDK 8 und 21. Wie in den anderen aresstack-Repositories (corenth, keepassrpc-java) laufen Releases über die
# gh-CLI mit GITHUB_TOKEN (contents: write), ohne Organisations-Secrets; Tag- und Release-Vorgänge mit diesem Token
# lösen keine weiteren Workflow-Läufe aus. Der Workflow greift für jeden Branch, auf dem diese Datei liegt.
name: release

on:
  push:
    branches: ['**']
  delete:
  workflow_dispatch:

jobs:
  jar:
    name: Fat Jar bauen und veröffentlichen
    if: github.event_name != 'delete'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      # Auf Branches ersetzt ein neuer Push den laufenden Snapshot-Lauf; auf main werden Läufe nacheinander
      # abgearbeitet, damit kein Release halb fertig abgebrochen wird. Dieselbe Gruppe nutzt der Cleanup-Job.
      group: release-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: gradle

      - name: Version und Art des Builds bestimmen
        id: version
        shell: bash
        run: |
          set -euo pipefail
          base="$(sed -n 's/^projectVersion=//p' gradle.properties | tr -d '[:space:]')"
          if ! printf '%s' "$base" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error file=gradle.properties::projectVersion muss MAJOR.MINOR.PATCH sein, ist aber '$base'"
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            version="$base"
            release=true
            tag="v$base"
          else
            version="$base-SNAPSHOT"
            release=false
            # Gleiche Ableitung wie im Job cleanup.
            safe="$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._-' '-')"
            digest="$(printf '%s' "$GITHUB_REF_NAME" | sha256sum | cut -c1-8)"
            tag="snapshot-$safe-$digest"
          fi
          {
            echo "base=$base"
            echo "version=$version"
            echo "release=$release"
            echo "tag=$tag"
            echo "jar=app-swing/build/libs/enterprise-ai-client-$version.jar"
            echo "sidecar=local-model-runtime-sidecar/build/distributions/local-model-runtime-sidecar-$version.zip"
          } >> "$GITHUB_OUTPUT"
          echo "Version $version, Tag $tag"

      - name: Bauen, testen und Fat Jar prüfen
        shell: bash
        run: >
          ./gradlew build --no-daemon --warning-mode all
          -Prelease=${{ steps.version.outputs.release }}
          -PbuildCommit=${{ github.sha }}

      # Der optionale lokale Java-21-Sidecar (Sprachausgabe, lokale Modelle) ist ein eigener Gradle-Build und wird als
      # Zip neben dem Fat Jar veröffentlicht. Erst nach dem Java-8-Build auf JDK 21 umschalten.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Lokalen Java-21-Sidecar bauen
        shell: bash
        run: >
          ./gradlew -p local-model-runtime-sidecar sidecarZip --no-daemon --warning-mode all
          -PprojectVersion=${{ steps.version.outputs.version }}

      - name: Manifest des Fat Jars anzeigen
        shell: bash
        run: |
          set -euo pipefail
          unzip -p "${{ steps.version.outputs.jar }}" META-INF/MANIFEST.MF
          ls -l "${{ steps.version.outputs.jar }}"

      - name: Jar als Workflow-Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-ai-client-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.version.outputs.jar }}
            ${{ steps.version.outputs.sidecar }}
          if-no-files-found: error

      - name: Release auf main anlegen
        if: steps.version.outputs.release == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          JAR: ${{ steps.version.outputs.jar }}
          SIDECAR: ${{ steps.version.outputs.sidecar }}
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::warning title=Kein Release angelegt::Tag $TAG existiert bereits. Die Version in gradle.properties wurde nicht erhöht; das Jar liegt nur als Workflow-Artefakt vor."
            {
              echo "## Kein Release angelegt"
              echo
              echo "Tag \`$TAG\` existiert bereits. Die Version in \`gradle.properties\` wurde seit dem letzten Release nicht erhöht."
              echo "Das Jar \`$(basename "$JAR")\` liegt nur als Workflow-Artefakt dieses Laufs vor."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          notes="$(mktemp)"
          {
            echo "Lauffähiges Jar der Swing-Anwendung (Java 8 oder neuer): \`java -jar $(basename "$JAR")\`"
            echo
            echo "Optional: \`$(basename "$SIDECAR")\` ist der lokale Java-21-Sidecar (Sprachausgabe, lokale Modelle). Entpacken und unter Einstellungen → Lokale Modelle \`local-model-runtime-sidecar.jar\` angeben; Java 21 wird automatisch erkannt."
            echo
            echo "Commit: $GITHUB_SHA · Build: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
          } > "$notes"
          gh release create "$TAG" "$JAR" "$SIDECAR" \
            --target "$GITHUB_SHA" \
            --title "enterprise-ai-client $VERSION" \
            --notes-file "$notes" \
            --generate-notes
          {
            echo "## Release $TAG angelegt"
            echo
            echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rollierenden Snapshot des Branches aktualisieren
        if: steps.version.outputs.release != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          JAR: ${{ steps.version.outputs.jar }}
          SIDECAR: ${{ steps.version.outputs.sidecar }}
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          # Wurde der Branch inzwischen gelöscht, würde das Veröffentlichen einen verwaisten Snapshot hinterlassen.
          if ! git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
            echo "::notice::Branch $BRANCH existiert nicht mehr; der Snapshot wird nicht veröffentlicht."
            exit 0
          fi
          # Tag auf den aktuellen Commit setzen (neu oder verschoben).
          git push --force origin "$GITHUB_SHA:refs/tags/$TAG"
          notes="$(mktemp)"
          {
            echo "Rollierender Snapshot des Branches \`$BRANCH\`: jeder Push ersetzt Tag und Jar. Nicht für den produktiven Einsatz."
            echo
            echo "Start (Java 8 oder neuer): \`java -jar $(basename "$JAR")\`"
            echo
            echo "Commit: $GITHUB_SHA · Build: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$notes"
          title="Snapshot $BRANCH ($VERSION)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Alte Assets entfernen (auch solche mit anderem Dateinamen nach einem Versionswechsel).
            gh release view "$TAG" --json assets --jq '.assets[].name' | while read -r asset; do
              [ -n "$asset" ] && gh release delete-asset "$TAG" "$asset" --yes || true
            done
            gh release upload "$TAG" "$JAR" "$SIDECAR"
            gh release edit "$TAG" --prerelease --title "$title" --notes-file "$notes"
          else
            gh release create "$TAG" "$JAR" "$SIDECAR" --prerelease --title "$title" --notes-file "$notes"
          fi
          {
            echo "## Snapshot $TAG aktualisiert"
            echo
            echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
          } >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    name: Snapshot eines gelöschten Branches entfernen
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      # Gleiche Gruppe wie der Push-Job dieses Branches: Cleanup wartet auf einen laufenden Snapshot-Lauf.
      group: release-refs/heads/${{ github.event.ref }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ github.event.ref }}
    steps:
      - name: Pre-Release und Tag löschen
        shell: bash
        run: |
          set -euo pipefail
          # Gleiche Ableitung wie im Job jar (Schritt "Version und Art des Builds bestimmen").
          safe="$(printf '%s' "$BRANCH" | tr -c 'A-Za-z0-9._-' '-')"
          digest="$(printf '%s' "$BRANCH" | sha256sum | cut -c1-8)"
          tag="snapshot-$safe-$digest"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release delete "$tag" --cleanup-tag --yes
            echo "Pre-Release und Tag $tag entfernt."
          elif gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
            gh api --method DELETE "repos/$GH_REPO/git/refs/tags/$tag"
            echo "Tag $tag entfernt (kein Pre-Release vorhanden)."
          else
            echo "Nichts zu entfernen für $tag."
          fi
