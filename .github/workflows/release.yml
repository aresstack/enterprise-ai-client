# Fat Jar der Swing-Anwendung bauen, prüfen und veröffentlichen.
#
#   main              -> echtes Release bei jedem Push: Version <MAJOR>.<MINOR>.<PATCH>, Tag v<version> plus
#                        GitHub-Release mit Jar, Ressourcen-Archiv und Update-Paket zur Vorversion.
#   alle anderen      -> genau ein rollierender Snapshot für das ganze Repository: Pre-Release unter dem Tag
#   Branches             "snapshot", dessen Tag und Jar jeder Push (egal von welchem Branch) ersetzt; zusätzlich
#                        Workflow-Artefakt. Titel und Notizen nennen Branch und Commit.
#
# Version auf main: projectVersion aus gradle.properties gibt MAJOR.MINOR und den Start-PATCH vor. Jeder Commit nach
# dem letzten Commit, der projectVersion geändert hat, erhöht PATCH um eins (git rev-list --count). Damit bekommt jeder
# Push auf main ohne Handarbeit eine eigene, aufsteigende Version, und parallele Läufe kollidieren nicht. Wer eine
# neue MINOR- oder MAJOR-Version will, setzt projectVersion; der Commit mit der Änderung wird genau diese Version.
#
# Aufräumen: Jeder Lauf löscht Pre-Releases samt Tag aus dem früheren Schema (ein Snapshot je Branch, Tags
# snapshot-<branch>-<hash>). Reguläre Releases, Patch-Releases (patch-*) und v0.71.0-rc1 bleiben unangetastet.
#
# Neben dem Jar liegt das Ressourcen-Archiv enterprise-ai-client-resources-<version>.zip (OpenNLP-Modelle mit
# Manifest, gradle/nlp-resources.gradle). Legt man es neben das Jar, installiert der Client daraus ohne Download.
# Ist eine Modellquelle gerade nicht erreichbar, erscheint das Release ohne Archiv (Warnung im Lauf); der Client lädt
# dann wie bisher selbst herunter.
#
# Der Build läuft mit JDK 8 (Zielplattform) und umfasst alle Tests sowie verifyFatJar und smokeStartFatJar
# (gradle/fat-jar.gradle); veröffentlicht wird nur ein grün gebautes Jar. build.yml bleibt der Pull-Request-Check
# auf JDK 8 und 21. Wie in den anderen aresstack-Repositories (corenth, keepassrpc-java) laufen Releases über die
# gh-CLI mit GITHUB_TOKEN (contents: write), ohne Organisations-Secrets; Tag- und Release-Vorgänge mit diesem Token
# lösen keine weiteren Workflow-Läufe aus. Der Workflow greift für jeden Branch, auf dem diese Datei liegt.
name: release

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  jar:
    name: Fat Jar bauen und veröffentlichen
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      # Alle Branches teilen sich den einen Snapshot: ein neuer Push ersetzt den laufenden Snapshot-Lauf.
      # Auf main bekommt jeder Commit eine eigene Gruppe: Eine gemeinsame Gruppe hält nur einen wartenden Lauf, und
      # GitHub bricht diesen ab, sobald ein weiterer Push kommt (so gingen die Releases 0.1.25 und 0.1.31 verloren).
      group: ${{ github.ref == 'refs/heads/main' && format('release-main-{0}', github.sha) || 'release-snapshot' }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Volle Historie: die PATCH-Nummer auf main zählt die Commits seit der letzten projectVersion-Änderung.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: gradle

      - name: Version und Art des Builds bestimmen
        id: version
        shell: bash
        run: |
          set -euo pipefail
          base="$(sed -n 's/^projectVersion=//p' gradle.properties | tr -d '[:space:]')"
          if ! printf '%s' "$base" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error file=gradle.properties::projectVersion muss MAJOR.MINOR.PATCH sein, ist aber '$base'"
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            bump="$(git log -1 --format=%H -G'^projectVersion=' -- gradle.properties)"
            count=0
            if [ -n "$bump" ]; then
              count="$(git rev-list --count "$bump..HEAD")"
            fi
            IFS=. read -r major minor patch <<< "$base"
            version="$major.$minor.$((patch + count))"
            release=true
            tag="v$version"
          else
            version="$base-SNAPSHOT"
            release=false
            tag="snapshot"
          fi
          {
            echo "base=$base"
            echo "base_effective=${version%-SNAPSHOT}"
            echo "version=$version"
            echo "release=$release"
            echo "tag=$tag"
            echo "jar=proasteion/exedra/build/libs/enterprise-ai-client-$version.jar"
          } >> "$GITHUB_OUTPUT"
          echo "Version $version, Tag $tag"

      - name: Bauen, testen und Fat Jar prüfen
        shell: bash
        run: >
          ./gradlew build --no-daemon --warning-mode all
          -Prelease=${{ steps.version.outputs.release }}
          -PprojectVersion=${{ steps.version.outputs.base_effective }}
          -PbuildCommit=${{ github.sha }}

      - name: Ressourcen-Archiv bauen
        id: resources
        shell: bash
        run: |
          set -uo pipefail
          zip="proasteion/application/build/distributions/enterprise-ai-client-resources-${{ steps.version.outputs.version }}.zip"
          if ./gradlew :proasteion:application:nlpResourcesZip --no-daemon \
               -Prelease=${{ steps.version.outputs.release }} \
               -PprojectVersion=${{ steps.version.outputs.base_effective }} && [ -f "$zip" ]; then
            unzip -l "$zip"
            echo "zip=$zip" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Kein Ressourcen-Archiv::Die OpenNLP-Modelle ließen sich nicht laden oder prüfen; das Release erscheint ohne Ressourcen-Archiv."
            echo "zip=" >> "$GITHUB_OUTPUT"
          fi

      - name: Manifest des Fat Jars anzeigen
        shell: bash
        run: |
          set -euo pipefail
          unzip -p "${{ steps.version.outputs.jar }}" META-INF/MANIFEST.MF
          ls -l "${{ steps.version.outputs.jar }}"

      - name: Jar als Workflow-Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-ai-client-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.version.outputs.jar }}
            ${{ steps.resources.outputs.zip }}
          if-no-files-found: error

      - name: Release auf main anlegen
        id: release
        if: steps.version.outputs.release == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          JAR: ${{ steps.version.outputs.jar }}
          ZIP: ${{ steps.resources.outputs.zip }}
        shell: bash
        run: |
          set -euo pipefail
          tag_exists() {
            echo "::warning title=Kein Release angelegt::Tag $TAG existiert bereits (Commit $(git ls-remote --tags origin "refs/tags/$TAG" | cut -c1-12)). Dieser Lauf für Commit $GITHUB_SHA legt kein Release an (erneuter Lauf für denselben Commit?); das Jar liegt nur als Workflow-Artefakt vor."
            {
              echo "## Kein Release angelegt"
              echo
              echo "Tag \`$TAG\` existiert bereits (erneuter Lauf für denselben Commit?)."
              echo "Das Jar \`$(basename "$JAR")\` liegt nur als Workflow-Artefakt dieses Laufs vor."
            } >> "$GITHUB_STEP_SUMMARY"
          }
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            tag_exists
            exit 0
          fi
          notes="$(mktemp)"
          {
            echo "Lauffähiges Jar der Swing-Anwendung (Java 8 oder neuer): \`java -jar $(basename "$JAR")\`"
            echo
            if [ -n "$ZIP" ]; then
              echo "Optional: \`$(basename "$ZIP")\` neben das Jar legen; der Einrichtungsassistent installiert die OpenNLP-Modelle dann ohne Download."
              echo
            fi
            echo "Commit: $GITHUB_SHA · Build: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
          } > "$notes"
          # Läufe auf main laufen parallel; kam ein anderer Lauf mit derselben Version zuvor, endet dieser ohne Fehler.
          assets=("$JAR")
          if [ -n "$ZIP" ]; then
            assets+=("$ZIP")
          fi
          if ! gh release create "$TAG" "${assets[@]}" \
            --target "$GITHUB_SHA" \
            --title "enterprise-ai-client $VERSION" \
            --notes-file "$notes" \
            --generate-notes; then
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              tag_exists
              exit 0
            fi
            exit 1
          fi
          {
            echo "## Release $TAG angelegt"
            echo
            echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "created=true" >> "$GITHUB_OUTPUT"

      # Genau ein inkrementelles Update-Paket vom direkten Vorgänger-Release zu diesem Jar (#92, #105: keine
      # Sprung-Pakete; der Updater in Merlins Kristallhöhle verkettet mehrere Pakete selbst über Version und
      # Inhaltsprüfsumme). Auf main hängt es am neuen Release, auf Branches prüft der Lauf nur, dass es entsteht.
      # Scheitert es (keine Vorversion, Netz), bleibt das Release ohne Update-Paket: nur eine Warnung.
      - name: Update-Paket zur Vorversion erzeugen
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          JAR: ${{ steps.version.outputs.jar }}
          CREATED: ${{ steps.release.outputs.created }}
        shell: bash
        run: |
          set -uo pipefail
          warn() { echo "::warning title=Kein Update-Paket::$1"; exit 0; }
          # Vorgänger ist die höchste reguläre Version unterhalb dieser, nicht das zuletzt veröffentlichte Release:
          # Läufe auf main laufen parallel, ein späterer Commit kann vor einem früheren veröffentlicht sein.
          own="${VERSION%-SNAPSHOT}"
          previous="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | select((.prerelease or .draft) | not) | .tag_name' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "$TAG" \
            | { cat; echo "v$own"; } | sort -V -u | sed -n "/^v$own\$/q;p" | tail -n 1)"
          [ -n "$previous" ] || warn "Keine Vorversion gefunden."
          dir="$(mktemp -d)"
          gh release download "$previous" --pattern 'enterprise-ai-client-[0-9]*.jar' --dir "$dir" \
            || warn "Jar von $previous nicht ladbar."
          base="$(ls "$dir"/enterprise-ai-client-*.jar | head -n 1)"
          [ -f "$base" ] || warn "Release $previous hat kein Jar."
          changes="$dir/changes.txt"
          gh api "repos/$GH_REPO/compare/$previous...$GITHUB_SHA" --jq '.commits[].commit.message | split("\n")[0]' \
            | grep -v '^Version [0-9]' | sed 's/^/- /' > "$changes" || true
          ./gradlew :proasteion:exedra:fatJarPatch --no-daemon -Prelease=${{ steps.version.outputs.release }} \
            -PprojectVersion=${{ steps.version.outputs.base_effective }} \
            -PpatchBase="$base" -PpatchTarget="$JAR" -PpatchChanges="$changes" \
            || warn "fatJarPatch von $previous nach $VERSION fehlgeschlagen."
          patch="$(ls proasteion/exedra/build/distributions/enterprise-ai-client-patch-*-to-"$VERSION".zip | head -n 1)"
          [ -f "$patch" ] || warn "Update-Paket fehlt nach fatJarPatch."
          ls -l "$patch"
          unzip -p "$patch" patch.properties
          if [ "$CREATED" = "true" ]; then
            gh release upload "$TAG" "$patch" || warn "Update-Paket nicht hochgeladen."
          fi

      - name: Rollierenden Snapshot aktualisieren
        if: steps.version.outputs.release != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          JAR: ${{ steps.version.outputs.jar }}
          ZIP: ${{ steps.resources.outputs.zip }}
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          # Tag auf den aktuellen Commit setzen (neu oder verschoben).
          git push --force origin "$GITHUB_SHA:refs/tags/$TAG"
          notes="$(mktemp)"
          {
            echo "Rollierender Snapshot, zuletzt gebaut vom Branch \`$BRANCH\`: jeder Push auf einen Branch außer main ersetzt Tag und Jar. Nicht für den produktiven Einsatz."
            echo
            echo "Start (Java 8 oder neuer): \`java -jar $(basename "$JAR")\`"
            echo
            echo "Commit: $GITHUB_SHA · Build: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$notes"
          title="Snapshot ($VERSION, $BRANCH)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Alte Assets entfernen (auch solche mit anderem Dateinamen nach einem Versionswechsel).
            gh release view "$TAG" --json assets --jq '.assets[].name' | while read -r asset; do
              [ -n "$asset" ] && gh release delete-asset "$TAG" "$asset" --yes || true
            done
            gh release upload "$TAG" "$JAR"
            if [ -n "$ZIP" ]; then
              gh release upload "$TAG" "$ZIP"
            fi
            gh release edit "$TAG" --prerelease --title "$title" --notes-file "$notes"
          else
            assets=("$JAR")
            if [ -n "$ZIP" ]; then
              assets+=("$ZIP")
            fi
            gh release create "$TAG" "${assets[@]}" --prerelease --latest=false --title "$title" --notes-file "$notes"
          fi
          {
            echo "## Snapshot $TAG aktualisiert"
            echo
            echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
          } >> "$GITHUB_STEP_SUMMARY"

      # Altlast des früheren Schemas (ein Snapshot-Pre-Release je Branch) entfernen. Nur Pre-Releases mit Tag
      # snapshot-*; der rollierende Snapshot "snapshot", reguläre Releases und patch-* bleiben.
      - name: Alte Snapshot-Releases je Branch entfernen
        shell: bash
        run: |
          set -uo pipefail
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | select(.prerelease and (.tag_name | startswith("snapshot-"))) | .tag_name' \
          | while read -r old; do
              [ -n "$old" ] || continue
              gh release delete "$old" --cleanup-tag --yes && echo "Entfernt: $old" \
                || echo "::warning::$old ließ sich nicht entfernen."
            done
