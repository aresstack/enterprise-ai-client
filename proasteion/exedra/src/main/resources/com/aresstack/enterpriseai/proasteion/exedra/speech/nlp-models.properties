# Modelle der Satz- und Spracherkennung beim Vorlesen, wie askai-java8 arch (ApacheOpenNlpModelCatalogProvider):
# die offiziellen Apache-OpenNLP-1.5-Satzmodelle und das Spracherkennungsmodell 1.8.3, alle mit opennlp-tools 1.9.4
# (Java 8) ladbar. Installiert wird nur auf Klick (Einstellungen -> Modelle -> Lokale Modelle) und nur, wenn Größe
# und SHA-256 genau stimmen; danach liegen sie unter <Anwendungsverzeichnis>/models/nlp/<id>/.
#
# models = Reihenfolge der Ids; je Id: name, capability (sentence | language), language, url, file, sha256, size.

models=sentence-de,sentence-en,langdetect

model.sentence-de.name=Satzerkennung Deutsch (de-sent.bin)
model.sentence-de.capability=sentence
model.sentence-de.language=de
model.sentence-de.url=https://sourceforge.net/projects/opennlp/files/models-1.5/de-sent.bin/download
model.sentence-de.file=de-sent.bin
model.sentence-de.sha256=e850b3a7939c5c95051451cc391df65968faa2feb0374d150fdf6c57af36be37
model.sentence-de.size=45782

model.sentence-en.name=Satzerkennung Englisch (en-sent.bin)
model.sentence-en.capability=sentence
model.sentence-en.language=en
model.sentence-en.url=https://sourceforge.net/projects/opennlp/files/models-1.5/en-sent.bin/download
model.sentence-en.file=en-sent.bin
model.sentence-en.sha256=bd6adffc85d66ccffd09ad1545ab798248193672c4da5c6669150e6a3b35e5b1
model.sentence-en.size=98533

model.langdetect.name=Spracherkennung, alle Sprachen (langdetect-183.bin)
model.langdetect.capability=language
model.langdetect.language=*
model.langdetect.url=https://dlcdn.apache.org/opennlp/models/langdetect/1.8.3/langdetect-183.bin
model.langdetect.file=langdetect-183.bin
model.langdetect.sha256=2ddf585fac2e02a9dcfb9a4a9cc9417562eaac351be2efb506a2eaa87f19e9d4
model.langdetect.size=10568188
