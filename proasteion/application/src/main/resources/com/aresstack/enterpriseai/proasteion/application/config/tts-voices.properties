# Stimmen (Sprecher) der TTS-Modelle der Enterprise-API, je Modellfamilie. Modelle mit mehreren Sprechern wählen ohne
# feste Stimme je Anfrage selbst; beim absatzweisen Vorlesen klingt dann jeder Absatz womöglich anders. Der Client
# schickt deshalb immer eine Stimme mit: die gespeicherte des Modells (speech.voices), sonst den Standard der Familie.
#
# families     = Reihenfolge der Familien
# <f>.match    = Teilwörter der Modellkennung (klein, Komma-Liste); die längste Übereinstimmung gewinnt
# <f>.male     = männliche Stimmen (Komma-Liste, Schreibweise wie der Dienst sie erwartet)
# <f>.female   = weibliche Stimmen
# <f>.default  = Stimme, wenn für das Modell keine gespeichert ist
#
# UNGEPRÜFT gegen die Enterprise-API: die Namen stammen aus den Modellkarten (Orpheus German: canopylabs, Qwen3-TTS
# CustomVoice: QwenLM). Kennt der Dienst andere Namen, hier anpassen oder im Einstellungsdialog frei eintippen.

families=orpheus,qwen3-tts

orpheus.match=orpheus
orpheus.male=thomas,max
orpheus.female=jana
orpheus.default=thomas

qwen3-tts.match=qwen3-tts,qwen3_tts,qwen-tts,qwen_tts
qwen3-tts.female=Vivian,Serena,Ono_Anna,Sohee
qwen3-tts.male=Ryan,Aiden,Dylan,Eric,Uncle_Fu
qwen3-tts.default=Vivian
