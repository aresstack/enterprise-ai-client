# Enterprise AI Client – Beispielkonfiguration (AP23)
#
# Ablage: <Benutzerverzeichnis>/.enterprise-ai-client/enterprise-ai-client.properties
#         (Windows: %APPDATA%\.enterprise-ai-client\enterprise-ai-client.properties)
# Überschreibbar: -Denterpriseai.config=<Datei> bzw. -Denterpriseai.home=<Verzeichnis>
#
# In dieser Datei stehen keine Secrets. API-Key und Passwörter liegen in KeePass; hier steht nur der Titel des
# KeePass-Eintrags als Secret-Referenz (z. B. "keepass:Enterprise AI API"). Die Datei ist UTF-8.
#
# Scheitert eine Anfrage, nennt die Fehlerblase die technische Ursache und einen Hinweis; die vollständige
# Ursachenkette steht im Protokoll unter <Anwendungsverzeichnis>/logs/enterprise-ai-client.0.log.

# --- Oberfläche ---------------------------------------------------------------------------------------------
ui.windowTitle=Enterprise AI Client

# --- Chat (interne GPT-kompatible Enterprise-API) -----------------------------------------------------------
# Pflicht: Basis-URL (der Adapter hängt chat/completions an) und Modellname.
chat.baseUrl=https://ki.intern.example/v1
chat.model=openai/gpt-oss-120b
# Pflicht: Titel des KeePass-Eintrags mit dem API-Key (Passwortfeld); ohne KeePass scheitern Anfragen je Aufruf.
chat.apiKeyRef=keepass:Enterprise AI API
# System-Prompt der Konversation; fehlt er oder ist er leer, gilt genau dieser Standard (ChatConfig.DEFAULT_SYSTEM_PROMPT).
chat.systemPrompt=Du bist ein hilfreicher Assistent. Antworte auf Deutsch, sofern der Benutzer keine andere Sprache verlangt.\n\n\
    Dir können Werkzeuge zum Durchsuchen und Lesen von Wissensquellen, Seiten und Anhängen zur Verfügung stehen. Nutze verfügbare Werkzeuge selbstständig, wenn sie für eine belastbare Antwort erforderlich sind.\n\n\
    Bei internen, organisationsspezifischen, projektbezogenen oder mehrdeutigen Begriffen und Abkürzungen bevorzuge verfügbare Wissensquellen gegenüber einer Antwort allein aus allgemeinem Modellwissen. Nimm bei Mehrdeutigkeit nicht einfach die allgemein bekannteste Bedeutung an.\n\n\
    Wenn die bereits gelesenen Quellen eine neue oder detailliertere Folgefrage nicht ausreichend beantworten, suche selbstständig erneut mit einer präziseren Suchanfrage. Warte nicht darauf, dass der Benutzer dich ausdrücklich zum erneuten Suchen auffordert.\n\n\
    Behaupte nicht, dass eine gesuchte Information in den verfügbaren Wissensquellen nicht vorhanden sei, bevor du – soweit passende Suchwerkzeuge verfügbar sind – gezielt nach der konkreten Information gesucht hast.\n\n\
    Verwende den bisherigen Gesprächskontext, um Suchanfragen zu präzisieren. Wenn zum Beispiel zunächst ein System beschrieben wurde und danach nach dem genauen Format eines darin vorkommenden Dateityps gefragt wird, suche gezielt nach diesem Dateityp, Aufbau, Schema, Feldern oder Format, statt nur bisherige Treffer erneut zusammenzufassen.\n\n\
    Wenn eine gezielte Suche keine ausreichenden Informationen liefert, sage klar, dass trotz Suche keine belastbare Antwort gefunden wurde. Erfinde keine fehlenden Details.\n\n\
    Erfinde niemals Werkzeugaufrufe, Werkzeugergebnisse, Quellen oder eigene Fähigkeiten. Behaupte keinen Modellnamen, Wissensstichtag oder verfügbare Werkzeuge, wenn dir diese Information nicht tatsächlich im aktuellen Laufzeitkontext bereitgestellt wurde.\n\n\
    Fragen nach deinen eigenen Fähigkeiten, Werkzeugen oder dem Client sind keine fachlichen Fragen an die Wissensbasis. Beantworte sie anhand der tatsächlich im aktuellen Laufzeitkontext verfügbaren Fähigkeiten und Werkzeuge.
chat.connectTimeoutMillis=10000
chat.readTimeoutMillis=120000
# REJECT (Standard, Server lehnt developer mit HTTP 500 ab), SEND_AS_SYSTEM oder SEND_AS_DEVELOPER (UNVERIFIED).
chat.developerRolePolicy=REJECT
# Optionale Standardparameter je Anfrage (alle getestet, siehe Nachtrag): temperature, topP, topK, maxTokens,
# presencePenalty, frequencyPenalty, stop (kommagetrennt, wird als Array gesendet), user.
#chat.temperature=0.2
#chat.topP=0.9
#chat.maxTokens=2048
#chat.user=enterprise-ai-client
# Tool-Calling über /chat/completions mit tools, gestreamt. Unterhaltungen mit Dateianhängen, Seiten oder angehakter
# Wissensquelle nutzen es immer; true schaltet es für jede Frage ein (Standard false).
#chat.tools.enabled=false
# Werkzeugrunden je Antwort (1–32, Standard 8; kein 0). Verlangt das Modell danach noch ein Werkzeug, antwortet es in
# einer letzten Runde ohne Werkzeuge aus den bisherigen Ergebnissen (Reiter „Tools“ der Einstellungen).
#chat.tools.maxRounds=8
# Abgeschaltete Werkzeuge (Reiter „Tools“ der Einstellungen), kommagetrennt; nicht genannte Werkzeuge sind aktiv.
#tools.disabled=knowledge_search

# --- Embeddings ---------------------------------------------------------------------------------------------
# Basis-URL: Standard ist chat.baseUrl (der Adapter hängt /embeddings an).
#embedding.baseUrl=https://ki.intern.example/v1
# Pflicht: Modell und Dimension. Die Dimension ist nur die Erwartung (768 ist geraten): liefert der Dienst eine
# andere, übernimmt der Client sie beim ersten Aufruf und schreibt konfigurierte und erkannte Dimension ins Protokoll.
embedding.model=danielheinz/e5-base-sts-en-de
embedding.dimension=768
# Standard: chat.apiKeyRef.
#embedding.apiKeyRef=keepass:Enterprise AI API
# SINGLE_STRING (Standard: ein Request je Text) oder ARRAY_UNVERIFIED (erst nach praktischem Test aktivieren).
embedding.inputMode=SINGLE_STRING
embedding.maxBatchSize=16
embedding.connectTimeoutMillis=10000
embedding.readTimeoutMillis=60000

# --- Modelle je Kategorie -----------------------------------------------------------------------------------
# Eine Auswahl je Kategorie, gesetzt im Einstellungen-Dialog (Reiter „Modelle“). Chat und Embeddings stehen oben
# unter chat.model und embedding.model. Wert: [<katalog>:]<modell>; Kataloge: kipitz (Enterprise-API, GET /models,
# Standard ohne Präfix) und local (installierte Stimmen, laufen im Client). Leer = nichts gewählt.
#model.rerank=
#model.tts=
#model.stt=
#model.vision=
#model.documentOcr=
#model.imageEmbedding=
# Modellverzeichnis lokaler Stimmen; Standard: <Anwendungsverzeichnis>/local-models
#models.local.modelRoot=

# --- Wissensbasis und RAG -----------------------------------------------------------------------------------
# Indexverzeichnis (Lucene-BM25 + Vektoren); Standard: <Anwendungsverzeichnis>/index
#knowledge.indexDirectory=C:/Daten/enterprise-ai-index
knowledge.chunk.maxTokens=350
knowledge.chunk.overlapSentences=1
knowledge.embeddingBatchSize=16
# Vorladen der Suchtreffer (MainframeMate „Vorabladen (Prefetch)“): ab der Cursorposition höchstens so viele
# Treffer, so viele parallele Abrufe im Hintergrund, Speicher-Cache in MB. Klick/knowledge_read lesen sofort.
#knowledge.prefetch.maxItems=100
#knowledge.prefetch.concurrency=4
#knowledge.prefetch.cacheMaxMb=50
# Passagen wie askai arch: Struktur zuerst, Satzgrenzen aus dem OpenNLP-Satzmodell dieser Sprache (de oder en,
# Modelle unter Einstellungen → Modelle → NLP; ohne Modell regelbasiert), Themenwechsel über Satzfenster.
#knowledge.passages.language=de
# Retrieval (AP10-Defaults): Reciprocal Rank Fusion aus Volltext und Cosine.
retrieval.keywordEnabled=true
retrieval.semanticEnabled=true
retrieval.keywordCandidates=20
retrieval.semanticCandidates=20
retrieval.keywordWeight=1.0
retrieval.semanticWeight=1.0
retrieval.rankConstant=60
# Höchstzahl der zusammengeführten Treffer vor dem Kontextaufbau (Reiter „Index“ der Einstellungen).
retrieval.maxResults=10
# -1 = kein Schwellwert. Bleibt aus: Cosine-Werte sind je Embedding-Modell verschieden skaliert; ob ein Treffer passt,
# entscheidet das Reranking (retrieval.rerank).
retrieval.minSemanticScore=-1
# Treffer vom Chat-Modell in einem Aufruf je Runde gegen die Frage bewerten lassen (Reranking und Evidenzprüfung);
# nur die kleinste ausreichende Menge kommt in den Kontext, und die Suche endet, sobald sie reicht (Standard true).
#retrieval.rerank=true
# Mindestzahl unabhängiger Quellen: so viele verschiedene Seiten (resourceId, nicht Abschnitte derselben Seite)
# müssen die Antwort stützen; 0 = keine Mindestzahl, nur die Evidenzprüfung (0–20, Standard 1).
#retrieval.minIndependentSources=1
# Nachrecherchen mit genauerer Anfrage, wenn die Treffer nicht reichen; 0 = keine (0–5, Standard 2).
#retrieval.maxFollowUps=2
# Live-Suche vor dem Retrieval des Chats: auf so viele geladene Treffer wartet die erste Evidenzbewertung, auf
# höchstens so viele eine Suche, wenn die Evidenz nicht reicht (das Vorladen im Hintergrund läuft weiter), und so
# viele Treffer holt sie je Quelle (Standard 1, 4, 10).
#retrieval.liveSearch.initialPages=1
#retrieval.liveSearch.maxPages=4
#retrieval.liveSearch.hitsPerSource=10
# Nachbarschaft der besten Treffer (ähnliche Absätze, Nachbarabsätze, gleicher Abschnitt, Elternseite):
# Startpunkte, Nachbarn je Art, Cosine-Schwelle für ähnliche Absätze, Anteil des Startpunkt-Scores.
retrieval.relations.enabled=true
retrieval.relations.seeds=3
retrieval.relations.neighbors=3
retrieval.relations.minSimilarity=0.80
retrieval.relations.weight=0.5
# Kontextblock der normalen Chat-Antwort (Reiter „Index“ der Einstellungen): Token-Budget und Höchstzahl der
# Suchauszüge. Unabhängig vom Recherche-Budget des Agenten (agent.research.maxPages).
context.maxTokens=1500
context.maxSources=6
#context.instruction=Beantworte die Frage anhand der folgenden Auszüge.

# --- Wissensquellen -----------------------------------------------------------------------------------------
# Je Wissensquelle ein Listeneintrag source.<n>.* (n = 1, 2, 3 ... nur die Position in der Liste) mit
# type=mediawiki, confluence, files, ftp, ndv oder jes und den Schlüsseln des Adapters. Die Identität einer Quelle
# ist ihre kanonische Adresse aus Typ und Endpoint, z. B. wiki://wiki.intern.example/w, confluence://cf.intern/confluence,
# ftp://mainframe.intern.example:21, ndv://host:2700 oder file:///C:/Daten/Handbuch. Sie steht in source.<n>.address
# und wird von der Anwendung gesetzt (fehlt sie, beim nächsten Start); eine zweite Quelle mit derselben Adresse wird
# abgelehnt. Ressourcen heißen <präfix>:<adresse>/<ziel>, etwa confluence:cf.intern/confluence/page/123456.
# Keine Einträge = keine Wissensquellen (nur Chat). Die Beispielblöcke unten sind auskommentiert, damit ein frisch
# eingerichteter Client nicht beim Start versucht, Beispielhosts zu indexieren ("Indexierung fehlgeschlagen").
# Zum Aktivieren eines Blocks das einfache # vor den Schlüsseln entfernen; Zeilen mit ## sind auch im aktiven
# Block optional und bleiben auskommentiert, bis sie gebraucht werden. Bequemer: im Drawer-Reiter
# „Wissensquellen“ hinzufügen, bearbeiten, entfernen und per Häkchen an- und abwählen.

# Beispiel MediaWiki (zum Aktivieren die Zeilen einkommentieren):
#source.1.type=mediawiki
#source.1.apiUrl=https://wiki.intern.example/w/api.php
#source.1.displayName=Intranet-Wiki
# Titel des KeePass-Eintrags mit Benutzername und Passwort; leer = anonym.
#source.1.credentialRef=keepass:Intranet-Wiki
#source.1.requiresLogin=true
# Startseiten des Crawls, Tiefe und Obergrenze.
#source.1.startPoints=Hauptseite,Handbuch
#source.1.maxDepth=2
#source.1.maxResources=500
# Abgewählt (Häkchen im Drawer-Reiter „Wissensquellen“): der Chat durchsucht die Quelle nicht.
#source.1.enabled=true
# Namensräume, deren Links verfolgt werden (0 = Artikel, 4 = Projekt).
#source.1.linkNamespaces=0
#source.1.connectTimeoutMillis=15000
#source.1.readTimeoutMillis=30000

# Beispiel Confluence (zum Aktivieren die Zeilen einkommentieren):
#source.2.type=confluence
#source.2.baseUrl=https://confluence.intern.example/confluence
# KeePass-Eintrag: mit Benutzername -> Basic, ohne Benutzername -> Bearer (Personal Access Token, UNVERIFIED).
#source.2.credentialRef=keepass:Confluence
# Startpunkte: Space (DEV oder space:DEV), Seiten-ID (123456 oder page:123456).
#source.2.startPoints=space:DEV
#source.2.maxDepth=3
#source.2.maxResources=1000
#source.2.pageSize=50
#source.2.includeAttachments=false
#source.2.searchSpaceKeys=DEV
#source.2.connectTimeoutMillis=15000
#source.2.readTimeoutMillis=60000
# Nur Entwicklung: Zugangsdaten auch über http erlauben.
#source.2.allowInsecureHttp=false
# Optional mTLS: Alias im Windows-Zertifikatsspeicher (Windows-MY) ...
##source.2.clientCertificate.alias=mein-client-zertifikat
# ... oder PKCS12-Datei; das Passwort liegt in KeePass (Passwortfeld des Eintrags).
##source.2.clientCertificate.keyStoreFile=C:/Zertifikate/client.p12
##source.2.clientCertificate.keyStorePasswordRef=keepass:Client-Zertifikat

# Beispiel lokale Dateien (Verzeichnis rekursiv; Text und Markdown direkt, PDF/Word/Excel/PowerPoint/HTML/Mail
# über Apache Tika). Zum Aktivieren die Zeilen einkommentieren:
#source.3.type=files
#source.3.directory=C:/Daten/Handbuch
# Unterordner relativ zum Verzeichnis (. = alles), Ordnertiefe, Obergrenzen je Lauf und je Datei (MB).
#source.3.startPoints=.
#source.3.maxDepth=20
#source.3.maxResources=5000
#source.3.maxFileMegabytes=50

# Beispiel FTP (Mainframe, z. B. COBOL-Quellen in PDS-Membern). Zum Aktivieren die Zeilen einkommentieren:
#source.4.type=ftp
#source.4.host=mainframe.intern.example
#source.4.port=21
# KeePass-Eintrag mit Benutzer und Passwort; leer = anonym.
#source.4.credentialRef=keepass:Mainframe
# Datasets/PDS (liefern ihre Member) oder einzelne Member, kommagetrennt.
#source.4.startPoints=HLQ.COBOL.SRC,HLQ.COPY.SRC
#source.4.maxDepth=1
#source.4.maxResources=2000
#source.4.encoding=ISO-8859-1
# Satzstruktur: auto (MVS = an), on oder off.
#source.4.recordStructure=auto
#source.4.connectTimeoutMillis=15000
#source.4.readTimeoutMillis=60000

# Beispiel Natural über NDV (Natural Development Server). Zum Aktivieren die Zeilen einkommentieren:
#source.5.type=ndv
#source.5.host=ndv.intern.example
#source.5.port=2700
# KeePass-Eintrag mit Benutzer und Passwort (Pflicht).
#source.5.credentialRef=keepass:NDV
# Bibliotheken, optional mit Namensfilter (MYLIB/CUST*).
#source.5.startPoints=MYLIB
#source.5.maxResources=5000

# Beispiel JES-Jobausgaben (JCL, Systemmeldungen, SYSPRINT) über den z/OS-FTP-Server. Zum Aktivieren die Zeilen einkommentieren:
#source.6.type=jes
#source.6.host=mainframe.intern.example
#source.6.port=21
#source.6.credentialRef=keepass:Mainframe
# Jobnamen-Filter, kommagetrennt.
#source.6.startPoints=*
# Besitzer: leer = eigene Jobs, * = alle.
#source.6.owner=
#source.6.status=OUTPUT
#source.6.maxResources=200
#source.6.encoding=ISO-8859-1

# Beispiel Outlook-Postfachdateien (PST/OST, lokal). Zum Aktivieren die Zeilen einkommentieren:
#source.7.type=outlook
#source.7.mailbox=C:/Users/name/Documents/Outlook-Dateien
# Ordner im Postfach (. = alles ab der Inhaltswurzel), z. B. /Posteingang
#source.7.startPoints=.
#source.7.maxDepth=15
#source.7.maxResources=5000

# Beispiel SharePoint-Site (REST-API). Zum Aktivieren die Zeilen einkommentieren:
#source.8.type=sharepoint
#source.8.siteUrl=https://sharepoint.intern.example/sites/team
# KeePass-Eintrag mit DOMÄNE\name und Passwort; ohne Eintrag gilt die Windows-Anmeldung des JDK
#source.8.credentialRef=keepass:SharePoint
# Bibliotheken oder Ordner relativ zur Site (. = alle Dokumentbibliotheken)
#source.8.startPoints=.
#source.8.maxDepth=10
#source.8.maxResources=2000
#source.8.maxFileMegabytes=50

# Beispiel BetaView-Dokumentarchiv (Ergebnisliste eines Favoriten). Zum Aktivieren die Zeilen einkommentieren:
#source.9.type=betaview
#source.9.baseUrl=https://betaview.intern.example/betaview/
#source.9.credentialRef=keepass:BetaView
#source.9.favoriteId=1234
#source.9.daysBack=60
# Muster der Auswahl (* = alle)
#source.9.extension=*
#source.9.form=*
#source.9.report=*
#source.9.jobName=*
#source.9.maxResources=200

# --- Security (KeePassRPC) ----------------------------------------------------------------------------------
# false: Anwendung startet ohne KeePass; alle Secret-Zugriffe scheitern mit verständlicher Meldung.
security.keepass.enabled=true
security.keepass.host=127.0.0.1
security.keepass.port=12546
security.keepass.origin=chrome-extension://enterpriseaiclient
security.keepass.clientId=EnterpriseAiClient
security.keepass.clientDisplayName=Enterprise AI Client
security.keepass.timeoutMillis=15000
# file (Standard: dauerhaft in security.keepass.pairingKeyFile, Dateirechte nur Besitzer) oder memory (nach jedem
# Start neues Pairing).
security.keepass.pairingKeyStore=file
#security.keepass.pairingKeyFile=C:/Users/ich/.enterprise-ai-client/keepassrpc-pairing.key

# --- Netzwerk -----------------------------------------------------------------------------------------------
# Proxy-Auflösung über die Bibliothek win-proxy-java; die Modusnamen sind deren Enum-Werte:
# DISABLED, MANUAL_PROXY, WINDOWS_STATIC_PROXY, PAC_URL_MANUAL, PAC_URL_POWERSHELL (Standard), PAC_URL_WSCRIPT,
# PAC_URL_WINDOWS_SETTINGS, WINDOWS_NATIVE_PROXY_SETTINGS, WINDOWS_NATIVE_ROUTE_RESOLVER.
# Die Route wird je Ziel aufgelöst und jeder Verbindung einzeln mitgegeben (kein globaler ProxySelector).
# NOT_IMPLEMENTED und Fehler werden gemeldet; die Anwendung fällt dann nie still auf DIRECT zurück.
network.proxy.mode=PAC_URL_POWERSHELL
# Nur MANUAL_PROXY:
#network.proxy.host=proxy.intern.example
#network.proxy.port=8080
# Nur PAC_URL_MANUAL: Adresse des PAC-/WPAD-Skripts.
#network.proxy.pacUrl=http://wpad.intern.example/wpad.dat
# Nur PAC_URL_POWERSHELL und PAC_URL_WSCRIPT: eigenes Skript, das die PAC-URL ausgibt. Leer: Standardskript der
# Bibliothek (liest AutoConfigURL aus den Windows-Einstellungen).
#network.proxy.pacDiscoveryScript=
# URL für "Proxy auflösen" und "HTTPS-Verbindung testen"; leer: <chat.baseUrl>/models.
#network.proxy.testUrl=
# Harte Obergrenze je Auflösung in Millisekunden (Skript, PAC-Download, Auswertung).
#network.proxy.resolveTimeoutMillis=45000
# Hosts ohne Proxy (Muster mit * erlaubt); Loopback ist immer ausgenommen.
#network.proxy.nonProxyHosts=*.intern.example
# Proxy-Anmeldung: NONE (Standard) oder BASIC. Bei BASIC steht der Benutzer im Feld "Benutzername" und das
# Passwort im Passwortfeld des genannten KeePass-Eintrags, nie in dieser Datei.
network.proxy.auth.mode=NONE
#network.proxy.auth.credentialRef=keepass:Firmen-Proxy
# User-Agent aller HTTP-Aufrufe; leer: EnterpriseAiClient/<Version>.
#network.http.userAgent=
# IPv6 bevorzugen (wirkt erst nach Neustart; nur, wenn IPv4-Ausgang gestört ist).
network.http.preferIPv6=false
# TLS über win-trust-java: JVM-Truststore (cacerts), Windows-ROOT, Windows Root+Intermediate; die Windows-Quellen
# gelten nur unter Windows.
network.tls.useJvmDefault=true
network.tls.useWindowsRoot=true
network.tls.useWindowsCaStores=true
# Optional: PEM- oder DER-Datei mit weiteren CA-Zertifikaten (z. B. das Zertifikat des Firmen-Proxys).
#network.tls.caCertificatesFile=C:/Zertifikate/firmen-ca.pem

# --- Agent-Modus (ACP) --------------------------------------------------------------------------------------
# false: nur Chat. true: Reiter "Agent"; der Agentenprozess bekommt je Start einen eigenen MCP-Endpoint mit Token
# über die Umgebungsvariablen ENTERPRISE_AI_MCP_*.
agent.enabled=false
# Kommando und Argumente (Shell-ähnlich, Anführungszeichen erlaubt), z. B. der Demo-Agent:
#agent.command=java
#agent.args=-jar "C:/Programme/enterprise-ai-client/acp-demo-agent-all.jar"
agent.requestTimeoutSeconds=30
agent.mcpEndpointId=agent-tools
agent.mcpDisplayName=Wissenswerkzeuge
# Grenzen der Wissenswerkzeuge search_knowledge / get_knowledge_document / refresh_knowledge_source (AP20):
# Zeichen je Antwort, Zeichen je Treffer-Ausschnitt, Treffer ohne Angabe (höchstens retrieval.maxResults),
# aufgezählte Fehler je Aktualisierung.
agent.tools.maxResponseChars=20000
agent.tools.snippetChars=600
agent.tools.defaultMaxResults=5
agent.tools.maxFailuresListed=20
