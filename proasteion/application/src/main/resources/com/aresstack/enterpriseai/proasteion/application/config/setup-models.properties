# Vorzugsmodelle des Einrichtungsassistenten (Schritt „Modelle“), solange noch nichts gewählt ist.
# Reihenfolge: genau diese Kennung, sonst genau ein Modell, dessen Kennung den Teil nach dem letzten „/“ enthält,
# sonst das erste angebotene Modell. Fehlt das Vorzugsmodell, ist das kein Fehler. <art>.match ersetzt den Teil nach
# dem letzten „/“ durch Teilwörter (Komma-Liste), die alle in der Kennung vorkommen müssen.
# tts ist die normale Sprachausgabe des Chats (model.tts), nie Merlins Stimme (setup.merlin.*).
chat=openai/gpt-oss-120b
embedding=danielheinz/e5-base-sts-en-de
tts=Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice
tts.match=qwen3-tts,customvoice
# vision beschreibt Bilder (model.vision), etwa Bildanhänge aus Confluence.
vision=Qwen/Qwen2.5-VL-72B-Instruct
vision.match=qwen,vl
