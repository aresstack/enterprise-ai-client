# Vorgaben für Merlin, den Begleiter des Einrichtungsassistenten. Überschreibbar in der Konfiguration und unter
# Einstellungen -> Sprachausgabe. Merlin spricht mit dieser Stimme, nicht mit dem TTS-Modell des Chats (model.tts);
# ist sie nicht verfügbar, bleibt es bei Sprechblasen (kein Rückfall auf eine andere Stimme).
setup.merlin.ttsModel=kipitz:orpheus-tts-3b-de
# Fester Sprecher dieses Modells (voice der Anfrage), damit Merlin nicht je Absatz anders klingt; nie die Stimme
# des Chats (speech.voice). Leer = Vorgabe des Dienstes.
setup.merlin.ttsVoice=thomas
