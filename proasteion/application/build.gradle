description = 'proasteion:application (corenth ADR-0001): neutraler Kompositionspunkt ohne Oberfläche. Liest die ' +
        'Konfiguration, baut Netz, Tresor-Brücken, Adapter, Index und Use Cases zu ApplicationPorts zusammen; ' +
        'exedra (Swing-Schale) und weitere Oberflächen konsumieren sie.'

dependencies {
    // Was die Schale von den Ports sieht (ApplicationPorts, Konfiguration), sieht sie über dieses Modul.
    api project(':astu:acropolis')
    api project(':astu:acropolis:chalcotheca')
    api project(':proasteion:platform:network')
    implementation project(':proasteion:platform:security-keepassrpc')
    implementation project(':chat-openai')
    implementation project(':embedding-openai')
    implementation project(':astu:acropolis:chalcotheca:anagraphai')
    implementation project(':astu:acropolis:chalcotheca:pinakes')
    // Global metadata catalog (#106): port and embedded H2 adapter.
    implementation project(':fact-api')
    implementation project(':fact-h2')
    // Browser per chat (#141): port and runtime (profile per chat, lazy start, recovery).
    implementation project(':browser-api')
    implementation project(':browser-runtime')
    implementation project(':browser-firefox')
    // Persistent memories (#144): port and embedded H2 adapter.
    implementation project(':memory-api')
    implementation project(':memory-h2')
    implementation project(':search-run-api')
    implementation project(':search-run-h2')
    implementation project(':proasteion:emporion:holkas:source-mediawiki')
    implementation project(':proasteion:emporion:holkas:source-confluence')
    implementation project(':proasteion:emporion:holkas:source-localfiles')
    implementation project(':proasteion:emporion:holkas:source-git')
    implementation project(':proasteion:emporion:holkas:source-ftp')
    implementation project(':proasteion:emporion:holkas:source-ndv')
    implementation project(':proasteion:emporion:holkas:source-outlook')
    implementation project(':proasteion:emporion:holkas:source-sharepoint')
    implementation project(':proasteion:emporion:holkas:source-betaview')
    implementation project(':proasteion:emporion:holkas')
    implementation project(':proasteion:emporion:deigma:document-tika')
    implementation project(':acp-solon-client')
    implementation project(':proasteion:katagogion:mcp-solon-runtime')
    implementation project(':model-kipitz')
    implementation project(':model-huggingface')
    implementation project(':speech-api')
    implementation project(':speech-runtime-api')
    implementation project(':speech-local')
    implementation project(':speech-onnx')
    implementation project(':text-runtime-api')
    implementation project(':text-local')
    implementation project(':text-onnx')
    // Satzgrenzen beim Indexieren und beim Vorlesen (OpenNLP wie askai arch): speech.NlpModels.
    implementation project(':speech-opennlp')
    // Anhänge (chat.DocumentAttachmentTextExtractor) über den Dokument-Port.
    implementation project(':proasteion:emporion:deigma')
    // Agent-Modus: ACP-Start mit MCP-Endpoint (agent.AcpAgentLauncher) und der eingebaute Recherche-Agent
    // (agent.ResearchAgentHost mit Weidezaun, Konzeptpapier und Projektablage).
    implementation project(':acp-client-api')
    implementation project(':proasteion:katagogion')
    // Eingebaute Produkthilfe (app_help_search, app_help_read) für Chat und Agent.
    implementation project(':proasteion:help')
    implementation project(':research-domain')
    implementation project(':research-api')
    implementation project(':research-scope')
    implementation project(':research-store')
    implementation project(':research-agent-runtime')
    implementation project(':research-concept')
    // Der eingebaute Recherche-Agent als eigener Prozess über ACP (askai-java8 arch: ResearchAgentMain). Nur zur
    // Laufzeit: der Kompositionspunkt startet ihn mit derselben Java-Laufzeit aus demselben Fat Jar.
    runtimeOnly project(':research-agent-acp')
    // Proxy je Ziel (net.HttpRoutes) und TLS-Vertrauen (net.TrustPolicy), wie bisher in exedra.
    implementation libs.win.proxy.java
    implementation libs.win.trust.java
    implementation libs.gson

    testImplementation testFixtures(project(':chat-api'))
    testImplementation testFixtures(project(':embedding-api'))
    testImplementation testFixtures(project(':astu:acropolis:chalcotheca'))
    testImplementation testFixtures(project(':source-api'))
    testImplementation testFixtures(project(':proasteion:platform:security-keepassrpc'))
    testImplementation libs.java.websocket
    testImplementation libs.gson
}

// Ressourcen-Archiv (OpenNLP-Modelle + Manifest) für das Release, siehe gradle/nlp-resources.gradle.
apply from: rootProject.file('gradle/nlp-resources.gradle')
