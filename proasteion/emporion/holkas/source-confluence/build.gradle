description = 'Adapter: Confluence als Knowledge Source (Strang F). Credentials nur über adyton.'

// AP25: Fake-Confluence (FakeConfluence, REST-Antworten) und ihr HTTP-Wrapper (FakeConfluenceServer) als
// Testfixtures für integration-tests; die Tests dieses Moduls sehen sie weiterhin.
apply plugin: 'java-test-fixtures'

dependencies {
    api project(':source-api')
    api project(':adyton')
    // Proxy-Route je Ziel (Port); die Umsetzung liefert exedra.
    api project(':proasteion:platform:network')
    implementation libs.gson
    implementation libs.jsoup
    // draw.io-Diagramme als SVG (DrawioDiagramRenderer über drawio-java); das SVG rastert der Lesebereich über Batik.
    implementation libs.drawio.java
    // draw.io-XML-Schablonen (BPMN-Tasks/-Events, Flowchart, Basic, Pfeile); ohne sie fiele jede solche Form auf die
    // PNG-Vorschau des Plugins zurück.
    runtimeOnly libs.drawio.stencils

    testFixturesImplementation libs.gson
    // Vertragstest ConfluenceAsyncHttpTransportContract für Implementierungen außerhalb dieses Moduls
    testFixturesApi libs.junit
    testImplementation testFixtures(project(':source-api'))
}
