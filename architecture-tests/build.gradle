description = 'Ausführbare Architekturregeln (AP1/AP24): Modulregistrierung, Abhängigkeitsrichtung, Technologiegrenzen.'

// Dieses Modul hat keine Produktionsklassen. Seine Tests lesen
//  1. ein aus Gradle erzeugtes Build-Modell (Module, deklarierte Projekt- und Bibliotheksabhängigkeiten,
//     Klassenverzeichnisse) und
//  2. die kompilierten Produktionsklassen aller anderen Module
// und prüfen beides gegen die ModuleRegistry. Ein neues Gradle-Modul, das dort nicht registriert ist,
// macht BuildModelTest.everyGradleModuleIsRegistered rot.

def scannedProjects = rootProject.subprojects.findAll { it != project }.sort { it.name }
scannedProjects.each { evaluationDependsOn(it.path) }

// Nur Produktionskonfigurationen zählen für die Abhängigkeitsrichtung (inklusive Annotation-Prozessoren,
// die beim Kompilieren des Produktionscodes laufen); Testabhängigkeiten (z. B. junit) bleiben außen vor.
def productionConfigurations = ['api', 'implementation', 'compileOnly', 'compileOnlyApi', 'runtimeOnly',
                                'annotationProcessor']

def buildModel = new TreeMap<String, String>()
buildModel.put('modules', rootProject.subprojects.collect { it.name }.sort().join(','))
scannedProjects.each { scanned ->
    def projectDependencies = new TreeSet<String>()
    def externalDependencies = new TreeSet<String>()
    productionConfigurations.each { configurationName ->
        def configuration = scanned.configurations.findByName(configurationName)
        if (configuration == null) {
            return
        }
        configuration.dependencies.each { dependency ->
            if (dependency instanceof ProjectDependency) {
                projectDependencies << rootProject.project(dependency.path).name
            } else {
                externalDependencies << "${dependency.group}:${dependency.name}".toString()
            }
        }
    }
    buildModel.put("projectDependencies.${scanned.name}".toString(), projectDependencies.join(','))
    buildModel.put("externalDependencies.${scanned.name}".toString(), externalDependencies.join(','))
    buildModel.put("classDirectories.${scanned.name}".toString(),
            scanned.sourceSets.main.output.classesDirs.files.collect { it.absolutePath }.sort().join(File.pathSeparator))
}

def buildModelFile = layout.buildDirectory.file('architecture/build-model.properties')

def writeBuildModel = tasks.register('writeArchitectureBuildModel') {
    description = 'Schreibt Module, deklarierte Abhängigkeiten und Klassenverzeichnisse für die Architekturtests.'
    inputs.property('buildModel', buildModel)
    outputs.file(buildModelFile)
    doLast {
        def properties = new Properties()
        properties.putAll(buildModel)
        def target = buildModelFile.get().asFile
        target.parentFile.mkdirs()
        target.withOutputStream { properties.store(it, 'Generated by :architecture-tests:writeArchitectureBuildModel') }
    }
}

dependencies {
    testImplementation libs.archunit
}

tasks.named('test') {
    dependsOn writeBuildModel
    dependsOn scannedProjects.collect { it.tasks.named('classes') }
    inputs.file(buildModelFile)
    inputs.files(scannedProjects.collect { it.sourceSets.main.output.classesDirs })
    systemProperty 'enterpriseai.architecture.buildModel', buildModelFile.get().asFile.absolutePath
}
