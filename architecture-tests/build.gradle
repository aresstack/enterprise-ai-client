description = 'Ausführbare Architekturregeln (AP1/AP24): Modulregistrierung, Abhängigkeitsrichtung, Technologiegrenzen.'

// Dieses Modul hat keine Produktionsklassen. Seine Tests lesen
//  1. ein aus Gradle erzeugtes Build-Modell (Module, deklarierte Projekt- und Bibliotheksabhängigkeiten,
//     Klassenverzeichnisse) und
//  2. die kompilierten Produktionsklassen aller anderen Module
// und prüfen beides gegen die ModuleRegistry. Ein neues Gradle-Modul, das dort nicht registriert ist,
// macht BuildModelTest.everyGradleModuleIsRegistered rot.

def scannedProjects = rootProject.subprojects.findAll { it != project }.sort { it.name }
scannedProjects.each { evaluationDependsOn(it.path) }

// Nur Produktionskonfigurationen zählen für die Abhängigkeitsrichtung (inklusive Annotation-Prozessoren,
// die beim Kompilieren des Produktionscodes laufen); Testabhängigkeiten (z. B. junit) bleiben außen vor.
def productionConfigurations = ['api', 'implementation', 'compileOnly', 'compileOnlyApi', 'runtimeOnly',
                                'annotationProcessor']
// Konfigurationen, über die eine Bibliothek zu Konsumenten durchsickert (ARCHITECTURE.md: Fremdbibliotheken
// in Adaptern mit implementation deklarieren, nicht mit api).
def exportedConfigurations = ['api', 'compileOnlyApi']

def buildModel = new TreeMap<String, String>()
buildModel.put('modules', rootProject.subprojects.collect { it.name }.sort().join(','))
scannedProjects.each { scanned ->
    def projectDependencies = new TreeSet<String>()
    def externalDependencies = new TreeSet<String>()
    def testFixtureDependencies = new TreeSet<String>()
    def exportedExternalDependencies = new TreeSet<String>()
    productionConfigurations.each { configurationName ->
        def configuration = scanned.configurations.findByName(configurationName)
        if (configuration == null) {
            return
        }
        configuration.dependencies.each { dependency ->
            if (dependency instanceof ProjectDependency) {
                def targetName = rootProject.project(dependency.path).name
                projectDependencies << targetName
                // testFixtures(project(':x')) fordert die Capability x-test-fixtures an.
                if (dependency.requestedCapabilities.any { it.name.endsWith('-test-fixtures') }) {
                    testFixtureDependencies << targetName
                }
            } else {
                def coordinate = "${dependency.group}:${dependency.name}".toString()
                externalDependencies << coordinate
                if (exportedConfigurations.contains(configurationName)) {
                    exportedExternalDependencies << coordinate
                }
            }
        }
    }
    buildModel.put("projectDependencies.${scanned.name}".toString(), projectDependencies.join(','))
    buildModel.put("externalDependencies.${scanned.name}".toString(), externalDependencies.join(','))
    buildModel.put("classDirectories.${scanned.name}".toString(),
            scanned.sourceSets.main.output.classesDirs.files.collect { it.absolutePath }.sort().join(File.pathSeparator))

    // AP24-Erweiterungen (gelesen von BuildModelExtension):
    buildModel.put("testFixtureDependencies.${scanned.name}".toString(), testFixtureDependencies.join(','))
    buildModel.put("exportedExternalDependencies.${scanned.name}".toString(), exportedExternalDependencies.join(','))
    def testFixtures = scanned.sourceSets.findByName('testFixtures')
    if (testFixtures != null) {
        buildModel.put("testFixtureClassDirectories.${scanned.name}".toString(),
                testFixtures.output.classesDirs.files.collect { it.absolutePath }.sort().join(File.pathSeparator))
    }
}

// AP24: Java-8-Ziel jedes Kompilierschritts (auch Tests, Testfixtures und dieses Modul selbst). Auf JDK 9+
// erwartet Java8CompatibilityTest release=8, auf JDK 8 target=1.8.
rootProject.subprojects.each { subproject ->
    def compileTasks = new TreeMap<String, String>()
    subproject.tasks.withType(JavaCompile).each { compile ->
        def release = compile.options.release.getOrNull()
        compileTasks.put(compile.name, release != null ? "release=${release}".toString()
                : "target=${compile.targetCompatibility}".toString())
    }
    buildModel.put("compileTasks.${subproject.name}".toString(),
            compileTasks.collect { name, target -> "${name}=${target}" }.join(','))
}
buildModel.put('rootDir', rootProject.projectDir.absolutePath)
// AP24: kompilierte Testklassen jedes Moduls (auch dieses), damit Java8CompatibilityTest alle Klassendateien sieht.
rootProject.subprojects.each { subproject ->
    def test = subproject.sourceSets.findByName('test')
    if (test != null) {
        buildModel.put("testClassDirectories.${subproject.name}".toString(),
                test.output.classesDirs.files.collect { it.absolutePath }.sort().join(File.pathSeparator))
    }
}

def buildModelFile = layout.buildDirectory.file('architecture/build-model.properties')

def writeBuildModel = tasks.register('writeArchitectureBuildModel') {
    description = 'Schreibt Module, deklarierte Abhängigkeiten und Klassenverzeichnisse für die Architekturtests.'
    inputs.property('buildModel', buildModel)
    outputs.file(buildModelFile)
    doLast {
        def properties = new Properties()
        properties.putAll(buildModel)
        def target = buildModelFile.get().asFile
        target.parentFile.mkdirs()
        target.withOutputStream { properties.store(it, 'Generated by :architecture-tests:writeArchitectureBuildModel') }
    }
}

dependencies {
    testImplementation libs.archunit
}

def projectsWithTestFixtures = scannedProjects.findAll { it.sourceSets.findByName('testFixtures') != null }

tasks.named('test') {
    dependsOn writeBuildModel
    dependsOn scannedProjects.collect { it.tasks.named('classes') }
    // AP24: Testfixtures werden auf Java-8-Bytecode geprüft und dürfen von Produktionsklassen nicht referenziert werden;
    // die Testklassen aller Module werden ebenfalls auf Java-8-Bytecode geprüft.
    dependsOn projectsWithTestFixtures.collect { it.tasks.named('testFixturesClasses') }
    dependsOn scannedProjects.collect { it.tasks.named('testClasses') }
    inputs.file(buildModelFile)
    inputs.files(scannedProjects.collect { it.sourceSets.main.output.classesDirs })
    inputs.files(projectsWithTestFixtures.collect { it.sourceSets.testFixtures.output.classesDirs })
    inputs.files(scannedProjects.collect { it.sourceSets.test.output.classesDirs })
    inputs.file(rootProject.file('settings.gradle'))
    systemProperty 'enterpriseai.architecture.buildModel', buildModelFile.get().asFile.absolutePath
    // Die älteren Regelklassen importieren die Produktionsklassen aller Module je Klasse neu und halten den Import
    // in einem statischen Feld bis zum Ende der Test-JVM; mit dem Gradle-Standard von 512 MB lief die JVM auf
    // JDK 8 seit #44 in java.lang.OutOfMemoryError (SourceBoundaryTest.importProductionClasses). Mit JDK-8-
    // ähnlichem String-Speicher (-XX:-CompactStrings) ist der Heap am Ende voll (nach der letzten Full GC noch
    // 425 MB belegt); 1 GB reichte bis zur Java-Erkennung (0.1.29), jetzt 2 GB. Dauerhafte Abhilfe: alle Regelklassen auf
    // ProductionClasses.all() umstellen, dann genügt wieder der Standard.
    maxHeapSize = '2g'
}
