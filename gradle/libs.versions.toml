# Zentrale Versionsdeklaration (AP1). Hier wird nur deklariert; aktiviert wird eine Bibliothek
# ausschließlich im build.gradle des Moduls, das sie benötigt. domain, application und die
# *-api-Module dürfen keine dieser Bibliotheken verwenden (architecture-tests prüft das).
# Alle Versionen sind Java-8-kompatibel (Bytecode <= 52); Herkunft siehe ARCHITECTURE.md.

[versions]
junit = "4.13.2"
archunit = "1.4.1"
lucene = "8.11.3"
noear = "3.10.1"
gson = "2.10.1"
okhttp = "4.9.3"
jsoup = "1.17.2"
jwbf = "3.1.1"
javaWebsocket = "1.5.2"
slf4j = "2.0.17"
winProxy = "0.2.0"
winTrust = "0.1.0"
flexmark = "0.62.2"
mermaidJava = "0.2.0-beta.2"
tika = "2.9.1"

[libraries]
# Test
junit = { module = "junit:junit", version.ref = "junit" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }

# knowledge-lucene
lucene-core = { module = "org.apache.lucene:lucene-core", version.ref = "lucene" }
lucene-analyzers-common = { module = "org.apache.lucene:lucene-analyzers-common", version.ref = "lucene" }
lucene-queryparser = { module = "org.apache.lucene:lucene-queryparser", version.ref = "lucene" }

# acp-solon-client, acp-demo-agent
acp-sdk = { module = "org.noear:acp-sdk", version.ref = "noear" }

# mcp-solon-runtime
solon = { module = "org.noear:solon", version.ref = "noear" }
solon-boot-jdkhttp = { module = "org.noear:solon-boot-jdkhttp", version.ref = "noear" }
solon-ai-mcp = { module = "org.noear:solon-ai-mcp", version.ref = "noear" }

# Adapter-intern (JSON, HTTP, HTML, MediaWiki, KeePassRPC-Transport)
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
jwbf = { module = "net.sourceforge:jwbf", version.ref = "jwbf" }
java-websocket = { module = "org.java-websocket:Java-WebSocket", version.ref = "javaWebsocket" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }

# app-swing (app.net): Proxy-Auflösung je Ziel-URL wie Browser und PowerShell (Angelos Bibliothek, Java 8; alle
# Modi DISABLED, MANUAL_PROXY, WINDOWS_STATIC_PROXY, PAC_URL_*, WINDOWS_NATIVE_*; bringt GraalJS 21.2 mit) und
# TLS-Vertrauen aus JVM-cacerts, Windows-ROOT und Windows-Root/Intermediate-Export (win-trust-java). Beide nur in
# app-swing als implementation; die Adapter sehen nur den Port http-api.
win-proxy-java = { module = "com.aresstack:win-proxy-java", version.ref = "winProxy" }
win-trust-java = { module = "com.aresstack:win-trust-java", version.ref = "winTrust" }

# app-swing (app.ui.markdown): Markdown-Rendering der Antworten wie askai-java8 arch (flexmark 0.62.x ist die letzte
# Java-8-Linie; Tabellen, Autolinks, Durchstreichen) und Mermaid-Diagramme als Bild ohne Browser und ohne Netz
# (mermaid-java: GraalJS 21.2 + Batik, dieselbe GraalJS-Version wie win-proxy-java). Nur in app-swing als implementation.
flexmark = { module = "com.vladsch.flexmark:flexmark", version.ref = "flexmark" }
flexmark-ext-tables = { module = "com.vladsch.flexmark:flexmark-ext-tables", version.ref = "flexmark" }
flexmark-ext-autolink = { module = "com.vladsch.flexmark:flexmark-ext-autolink", version.ref = "flexmark" }
flexmark-ext-gfm-strikethrough = { module = "com.vladsch.flexmark:flexmark-ext-gfm-strikethrough", version.ref = "flexmark" }
mermaid-java = { module = "com.aresstack:mermaid-java", version.ref = "mermaidJava" }

# document-tika: Dokument-Extraktion (PDF, Office, HTML, Mail) wie MainframeMate; nur in document-tika als implementation.
tika-core = { module = "org.apache.tika:tika-core", version.ref = "tika" }
tika-parsers-standard = { module = "org.apache.tika:tika-parsers-standard-package", version.ref = "tika" }
