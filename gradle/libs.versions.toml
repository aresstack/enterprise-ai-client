# Zentrale Versionsdeklaration (AP1). Hier wird nur deklariert; aktiviert wird eine Bibliothek
# ausschließlich im build.gradle des Moduls, das sie benötigt. domain, application und die
# *-api-Module dürfen keine dieser Bibliotheken verwenden (architecture-tests prüft das).
# Alle Versionen sind Java-8-kompatibel (Bytecode <= 52); Herkunft siehe ARCHITECTURE.md.

[versions]
junit = "4.13.2"
archunit = "1.4.1"
lucene = "8.11.3"
noear = "3.10.1"
gson = "2.10.1"
okhttp = "4.9.3"
jsoup = "1.17.2"
jwbf = "3.1.1"
javaWebsocket = "1.5.2"
slf4j = "2.0.17"

[libraries]
# Test
junit = { module = "junit:junit", version.ref = "junit" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }

# knowledge-lucene
lucene-core = { module = "org.apache.lucene:lucene-core", version.ref = "lucene" }
lucene-analyzers-common = { module = "org.apache.lucene:lucene-analyzers-common", version.ref = "lucene" }
lucene-queryparser = { module = "org.apache.lucene:lucene-queryparser", version.ref = "lucene" }

# acp-solon-client, acp-demo-agent
acp-sdk = { module = "org.noear:acp-sdk", version.ref = "noear" }

# mcp-solon-runtime
solon = { module = "org.noear:solon", version.ref = "noear" }
solon-boot-jdkhttp = { module = "org.noear:solon-boot-jdkhttp", version.ref = "noear" }
solon-ai-mcp = { module = "org.noear:solon-ai-mcp", version.ref = "noear" }

# Adapter-intern (JSON, HTTP, HTML, MediaWiki, KeePassRPC-Transport)
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
jwbf = { module = "net.sourceforge:jwbf", version.ref = "jwbf" }
java-websocket = { module = "org.java-websocket:Java-WebSocket", version.ref = "javaWebsocket" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }
