// Modulschnitt und Abhängigkeitsrichtung: siehe ARCHITECTURE.md.
// Ein neues Modul muss zusätzlich in architecture-tests (ModuleRegistry) registriert werden,
// sonst wird BuildModelTest.everyGradleModuleIsRegistered rot.
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenCentral()
    }
}

rootProject.name = 'enterprise-ai-client'

// Stadt aus corenth (ARCHITECTURE.md, „Die Stadt“): adyton, astu → acropolis → chalcotheca → {tamias, anagraphai},
// proasteion → {application, exedra, katagogion, emporion → {holkas, deigma}, platform → {network, security-keepassrpc}}.
// Grenzmodule ohne eigene Klassen: proasteion, emporion, platform.
include 'proasteion'
include 'proasteion:emporion'
include 'proasteion:platform'

// Kern
include 'astu'
include 'astu:acropolis'

// Strang A – Chat
include 'chat-api'
include 'chat-openai'

// Strang N (Netz): neutraler Port für die HTTP-Route je Ziel-URL; Implementierung in exedra (app.net).
include 'proasteion:platform:network'

// Browser je Chat (#141): Port mit Engine-SPI, Laufzeit (Profil je Chat, Lazy-Start, Recovery)
include 'browser-api'
include 'browser-runtime'
include 'browser-firefox'

// Strang C – Embedding
include 'embedding-api'
include 'embedding-openai'

// Strang D – Knowledge-Index
include 'astu:acropolis:chalcotheca'
include 'astu:acropolis:chalcotheca:tamias'
include 'astu:acropolis:chalcotheca:anagraphai'
include 'astu:acropolis:chalcotheca:pinakes'

