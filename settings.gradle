include 'proasteion:emporion:holkas:source-git'
// Mainframe über FTP (MVS-Datasets, COBOL)
include 'proasteion:emporion:holkas:source-ftp'
// Mainframe: Natural über NDV
include 'proasteion:emporion:holkas:source-ndv'

// Outlook-Postfachdateien (PST/OST) über java-libpst
