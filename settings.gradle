// Modulschnitt und Abhängigkeitsrichtung: siehe ARCHITECTURE.md.
// Ein neues Modul muss zusätzlich in architecture-tests (ModuleRegistry) registriert werden,
// sonst wird BuildModelTest.everyGradleModuleIsRegistered rot.
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenCentral()
    }
}

rootProject.name = 'enterprise-ai-client'

// Kern
include 'domain'
include 'application'

// Strang A – Chat
include 'chat-api'
include 'chat-openai'

// Strang N (Netz): neutraler Port für die HTTP-Route je Ziel-URL; Implementierung in app-swing (app.net).
include 'http-api'

// Strang C – Embedding
include 'embedding-api'
include 'embedding-openai'

// Strang D – Knowledge-Index
include 'knowledge-api'
include 'knowledge-lucene'

// Strang E – Knowledge Sources (Strang F: source-confluence)
include 'source-api'
include 'source-mediawiki'
include 'source-confluence'
include 'source-localfiles'
// Mainframe über FTP (MVS-Datasets, COBOL)
include 'source-ftp'
// Mainframe: Natural über NDV
include 'source-ndv'
// SharePoint über WebDAV
include 'source-sharepoint'
// Outlook-Postfachdateien (PST/OST)
include 'source-outlook'
// BetaView (Listen, Reports)
include 'source-betaview'

// Ressourcenschicht aus corenth: Port (AcquisitionPort, Bronze) und Holkas-Connectoren über den Quellen
include 'resource-api'
include 'resource-holkas'

// Dokument-Extraktion (aus corenth deigma, Tika wie MainframeMate)
include 'document-api'
include 'document-tika'

// Modellverwaltung: Katalog-Port, Enterprise-API-Katalog (KIPITZ), optionaler lokaler Java-21-Sidecar
include 'model-api'
include 'model-kipitz'
include 'model-sidecar'

// Sprachausgabe: neutraler Port; heute nur über den lokalen Sidecar (model-sidecar)
include 'speech-api'

// Strang F – Security
include 'security-api'
include 'security-keepassrpc'

// Strang G – ACP
include 'acp-client-api'
include 'acp-solon-client'
include 'acp-demo-agent'

// Strang H – MCP
include 'mcp-runtime-api'
include 'mcp-solon-runtime'

// Strang B – Swing-Comic-UI und Composition Root
include 'comic-controls'
include 'app-swing'

// AP24 – ausführbare Architekturregeln
include 'architecture-tests'

// AP25 – Integrations- und Vertical-Slice-Tests A–G (nur Testcode, getrennter Live-Lauf)
include 'integration-tests'
