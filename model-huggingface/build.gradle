description = 'Adapter: Versorgung des Clients mit lokalen TTS-Stimmen vom Hugging Face Hub über huggingface4j (Download, Fortsetzen, Prüfung).'

dependencies {
    api project(':model-api')
    // Proxy-Route je Anfrage über den neutralen Port network aus der Composition Root.
    api project(':proasteion:platform:network')
    // Angelos Java-8-Hub-Client; bleibt im Adapter (implementation, nicht api).
    implementation libs.huggingface4j
    // Hub-Metadaten (Größe, LFS-SHA-256) je Datei lesen; nur paketintern.
    implementation libs.gson
}
