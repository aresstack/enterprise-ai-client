# Kuratierte lokale Stimmen für die Sprachausgabe im Client (ONNX Runtime im Prozess, Pilot).
# Quelle: Hugging Face Hub, Repository rhasspy/piper-voices (je Stimme <name>.onnx + <name>.onnx.json).
# Der Client lädt sie mit huggingface4j nach <Modellverzeichnis>/<id> und liest das Piper-Format direkt.
# Nur deutsche Stimmen: espeak-Stimmen brauchen Phoneme, der Client phonemisiert ohne externes Programm nur
# Deutsch (regelbasiert, Näherung an espeak-ng).
#
# hub.endpoint = Basis-URL des Hugging Face Hubs (Downloads und Metadaten: Größe und SHA-256 je Datei).
# voices = Reihenfolge der Ids; je Id: name, language, repository, revision (leer = main), files (Komma-Liste).

hub.endpoint=https://huggingface.co


voices=de_DE-thorsten-medium,de_DE-thorsten-high,de_DE-kerstin-low,de_DE-ramona-low,de_DE-eva_k-x_low

voice.de_DE-thorsten-medium.name=Thorsten (Deutsch, mittlere Qualität)
voice.de_DE-thorsten-medium.language=de_DE
voice.de_DE-thorsten-medium.repository=rhasspy/piper-voices
voice.de_DE-thorsten-medium.revision=main
voice.de_DE-thorsten-medium.files=de/de_DE/thorsten/medium/de_DE-thorsten-medium.onnx,de/de_DE/thorsten/medium/de_DE-thorsten-medium.onnx.json

voice.de_DE-thorsten-high.name=Thorsten (Deutsch, hohe Qualität)
voice.de_DE-thorsten-high.language=de_DE
voice.de_DE-thorsten-high.repository=rhasspy/piper-voices
voice.de_DE-thorsten-high.revision=main
voice.de_DE-thorsten-high.files=de/de_DE/thorsten/high/de_DE-thorsten-high.onnx,de/de_DE/thorsten/high/de_DE-thorsten-high.onnx.json

voice.de_DE-kerstin-low.name=Kerstin (Deutsch, niedrige Qualität)
voice.de_DE-kerstin-low.language=de_DE
voice.de_DE-kerstin-low.repository=rhasspy/piper-voices
voice.de_DE-kerstin-low.revision=main
voice.de_DE-kerstin-low.files=de/de_DE/kerstin/low/de_DE-kerstin-low.onnx,de/de_DE/kerstin/low/de_DE-kerstin-low.onnx.json

voice.de_DE-ramona-low.name=Ramona (Deutsch, niedrige Qualität)
voice.de_DE-ramona-low.language=de_DE
voice.de_DE-ramona-low.repository=rhasspy/piper-voices
voice.de_DE-ramona-low.revision=main
voice.de_DE-ramona-low.files=de/de_DE/ramona/low/de_DE-ramona-low.onnx,de/de_DE/ramona/low/de_DE-ramona-low.onnx.json

voice.de_DE-eva_k-x_low.name=Eva K. (Deutsch, sehr niedrige Qualität)
voice.de_DE-eva_k-x_low.language=de_DE
voice.de_DE-eva_k-x_low.repository=rhasspy/piper-voices
voice.de_DE-eva_k-x_low.revision=main
voice.de_DE-eva_k-x_low.files=de/de_DE/eva_k/x_low/de_DE-eva_k-x_low.onnx,de/de_DE/eva_k/x_low/de_DE-eva_k-x_low.onnx.json

# Vorgeschlagene Modelle anderer Funktionen (Gruppe „Vorschläge“ im Reiter „Lokale Modelle“): suggestions = Reihenfolge
# der Ids; je Id name, repository und category (STT, CHAT oder EMBEDDING). Die Dateien bestimmt der Client beim
# Installieren aus dem Dateibaum des Repositorys, wie bei einem Treffer der Hub-Suche.
# Spracheingabe: der Gemma-4-E2B-Export mit Audio-Eingang (audio_encoder, embed_tokens, decoder_model_merged).
suggestions=gemma-4-e2b-audio

suggestion.gemma-4-e2b-audio.name=Gemma 4 E2B (Spracheingabe, onnx-community)
suggestion.gemma-4-e2b-audio.repository=onnx-community/gemma-4-E2B-it-ONNX
suggestion.gemma-4-e2b-audio.category=STT
