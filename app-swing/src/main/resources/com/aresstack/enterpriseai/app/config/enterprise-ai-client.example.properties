# Enterprise AI Client – Beispielkonfiguration (AP23)
#
# Ablage: <Benutzerverzeichnis>/.enterprise-ai-client/enterprise-ai-client.properties
#         (Windows: %APPDATA%\.enterprise-ai-client\enterprise-ai-client.properties)
# Überschreibbar: -Denterpriseai.config=<Datei> bzw. -Denterpriseai.home=<Verzeichnis>
#
# In dieser Datei stehen keine Secrets. API-Key und Passwörter liegen in KeePass; hier steht nur der Titel des
# KeePass-Eintrags als Secret-Referenz (z. B. "keepass:Enterprise AI API"). Die Datei ist UTF-8.
#
# Scheitert eine Anfrage, nennt die Fehlerblase die technische Ursache und einen Hinweis; die vollständige
# Ursachenkette steht im Protokoll unter <Anwendungsverzeichnis>/logs/enterprise-ai-client.0.log.

# --- Oberfläche ---------------------------------------------------------------------------------------------
ui.windowTitle=Enterprise AI Client

# --- Chat (interne GPT-kompatible Enterprise-API) -----------------------------------------------------------
# Pflicht: Basis-URL (der Adapter hängt chat/completions an) und Modellname.
chat.baseUrl=https://ki.intern.example/v1
chat.model=openai/gpt-oss-120b
# Pflicht: Titel des KeePass-Eintrags mit dem API-Key (Passwortfeld); ohne KeePass scheitern Anfragen je Aufruf.
chat.apiKeyRef=keepass:Enterprise AI API
# Optionaler System-Prompt der Konversation.
chat.systemPrompt=Du bist ein hilfreicher Assistent. Antworte auf Deutsch.
chat.connectTimeoutMillis=10000
chat.readTimeoutMillis=120000
# REJECT (Standard, Server lehnt developer mit HTTP 500 ab), SEND_AS_SYSTEM oder SEND_AS_DEVELOPER (UNVERIFIED).
chat.developerRolePolicy=REJECT
# Optionale Standardparameter je Anfrage (alle getestet, siehe Nachtrag): temperature, topP, topK, maxTokens,
# presencePenalty, frequencyPenalty, stop (kommagetrennt, wird als Array gesendet), user.
#chat.temperature=0.2
#chat.topP=0.9
#chat.maxTokens=2048
#chat.user=enterprise-ai-client

# --- Embeddings ---------------------------------------------------------------------------------------------
# Basis-URL: Standard ist chat.baseUrl (der Adapter hängt /embeddings an).
#embedding.baseUrl=https://ki.intern.example/v1
# Pflicht: Modell und Dimension. Dimension von danielheinz/e5-base-sts-en-de vermutlich 768 (UNVERIFIED).
embedding.model=danielheinz/e5-base-sts-en-de
embedding.dimension=768
# Standard: chat.apiKeyRef.
#embedding.apiKeyRef=keepass:Enterprise AI API
# SINGLE_STRING (Standard: ein Request je Text) oder ARRAY_UNVERIFIED (erst nach praktischem Test aktivieren).
embedding.inputMode=SINGLE_STRING
embedding.maxBatchSize=16
embedding.connectTimeoutMillis=10000
embedding.readTimeoutMillis=60000

# --- Wissensbasis und RAG -----------------------------------------------------------------------------------
# Indexverzeichnis (Lucene-BM25 + Vektoren); Standard: <Anwendungsverzeichnis>/index
#knowledge.indexDirectory=C:/Daten/enterprise-ai-index
# Alle Quellen beim Start im Hintergrund indexieren.
knowledge.indexOnStartup=true
knowledge.chunk.maxTokens=350
knowledge.chunk.overlapSentences=1
knowledge.embeddingBatchSize=16
# Retrieval (AP10-Defaults): Reciprocal Rank Fusion aus Volltext und Cosine.
retrieval.keywordEnabled=true
retrieval.semanticEnabled=true
retrieval.keywordCandidates=20
retrieval.semanticCandidates=20
retrieval.keywordWeight=1.0
retrieval.semanticWeight=1.0
retrieval.rankConstant=60
retrieval.maxResults=10
# -1 = kein Schwellwert
retrieval.minSemanticScore=-1
# Kontextblock für den Chat.
context.maxTokens=1500
context.maxSources=6
#context.instruction=Beantworte die Frage anhand der folgenden Auszüge.

# --- Wissensquellen -----------------------------------------------------------------------------------------
# Kommagetrennte Liste der Quell-IDs; je ID ein Block source.<id>.* mit type=mediawiki oder type=confluence.
# Leer = keine Wissensquellen (nur Chat). Die Beispielblöcke unten sind auskommentiert, damit ein frisch
# eingerichteter Client nicht beim Start versucht, Beispielhosts zu indexieren ("Indexierung fehlgeschlagen").
# Zum Aktivieren eines Blocks das einfache # vor den Schlüsseln entfernen; Zeilen mit ## sind auch im aktiven
# Block optional und bleiben auskommentiert, bis sie gebraucht werden. Bequemer: im Drawer-Reiter
# „Wissensquellen“ hinzufügen, bearbeiten, entfernen und per Häkchen an- und abwählen.
sources=

# Beispiel MediaWiki (zum Aktivieren sources=wiki setzen und die Zeilen einkommentieren):
#source.wiki.type=mediawiki
#source.wiki.apiUrl=https://wiki.intern.example/w/api.php
# Stabiler Schlüssel in den Ressourcen-IDs (wiki:<siteKey>/<Titel>); nach dem ersten Indexieren nicht ändern.
#source.wiki.siteKey=intern
#source.wiki.displayName=Intranet-Wiki
# Titel des KeePass-Eintrags mit Benutzername und Passwort; leer = anonym.
#source.wiki.credentialRef=keepass:Intranet-Wiki
#source.wiki.requiresLogin=true
# Startseiten des Crawls, Tiefe und Obergrenze.
#source.wiki.startPoints=Hauptseite,Handbuch
#source.wiki.maxDepth=2
#source.wiki.maxResources=500
# Abgewählt (Häkchen im Drawer-Reiter „Wissensquellen“): weder Indexierung beim Start noch Suche im Chat.
#source.wiki.enabled=true
# Namensräume, deren Links verfolgt werden (0 = Artikel, 4 = Projekt).
#source.wiki.linkNamespaces=0
#source.wiki.connectTimeoutMillis=15000
#source.wiki.readTimeoutMillis=30000

# Beispiel Confluence (zum Aktivieren sources=wiki,confluence bzw. sources=confluence setzen):
#source.confluence.type=confluence
#source.confluence.baseUrl=https://confluence.intern.example/confluence
# KeePass-Eintrag: mit Benutzername -> Basic, ohne Benutzername -> Bearer (Personal Access Token, UNVERIFIED).
#source.confluence.credentialRef=keepass:Confluence
# Startpunkte: Space (DEV oder space:DEV), Seiten-ID (123456 oder page:123456).
#source.confluence.startPoints=space:DEV
#source.confluence.maxDepth=3
#source.confluence.maxResources=1000
#source.confluence.pageSize=50
#source.confluence.includeAttachments=false
#source.confluence.searchSpaceKeys=DEV
#source.confluence.connectTimeoutMillis=15000
#source.confluence.readTimeoutMillis=60000
# Nur Entwicklung: Zugangsdaten auch über http erlauben.
#source.confluence.allowInsecureHttp=false
# Optional mTLS: Alias im Windows-Zertifikatsspeicher (Windows-MY) ...
##source.confluence.clientCertificate.alias=mein-client-zertifikat
# ... oder PKCS12-Datei; das Passwort liegt in KeePass (Passwortfeld des Eintrags).
##source.confluence.clientCertificate.keyStoreFile=C:/Zertifikate/client.p12
##source.confluence.clientCertificate.keyStorePasswordRef=keepass:Client-Zertifikat

# --- Security (KeePassRPC) ----------------------------------------------------------------------------------
# false: Anwendung startet ohne KeePass; alle Secret-Zugriffe scheitern mit verständlicher Meldung.
security.keepass.enabled=true
security.keepass.host=127.0.0.1
security.keepass.port=12546
security.keepass.origin=chrome-extension://enterpriseaiclient
security.keepass.clientId=EnterpriseAiClient
security.keepass.clientDisplayName=Enterprise AI Client
security.keepass.timeoutMillis=15000
# file (Standard: dauerhaft in security.keepass.pairingKeyFile, Dateirechte nur Besitzer) oder memory (nach jedem
# Start neues Pairing).
security.keepass.pairingKeyStore=file
#security.keepass.pairingKeyFile=C:/Users/ich/.enterprise-ai-client/keepassrpc-pairing.key

# --- Netzwerk -----------------------------------------------------------------------------------------------
# AUTO (Standard): wie Browser und PowerShell auf diesem Rechner. Gibt es ein PAC-/WPAD-Proxyskript (Adresse aus
# network.proxy.pacUrl oder aus den Windows-Einstellungen), entscheidet es je Ziel; sonst gelten die
# Systemeinstellungen. SYSTEM: nur die Proxy-Einstellungen des Betriebssystems (fester Proxy der Windows-
# Internetoptionen; Java 8 selbst wertet kein PAC-Skript aus) bzw. die JVM-Properties -Dhttp(s).proxyHost.
# NONE: nie Proxy. MANUAL: fester Proxy aus host/port. Proxy-Authentifizierung wird nicht unterstützt.
# Das Ergebnis für den KI-Dienst steht beim Start im Protokoll ("Route zum KI-Dienst ...").
network.proxy.mode=AUTO
#network.proxy.host=proxy.intern.example
#network.proxy.port=8080
# Nur AUTO: Adresse des PAC-Skripts (http, https oder file), wenn sie nicht aus den Windows-Einstellungen kommen soll.
#network.proxy.pacUrl=http://wpad.intern.example/wpad.dat
# Nur AUTO ohne pacUrl: WINDOWS_SETTINGS (Standard; Registry per reg.exe, auch Gruppenrichtlinien und WPAD-Flag)
# oder POWERSHELL (Einzeiler liest AutoConfigURL, falls reg.exe gesperrt ist).
#network.proxy.pacDiscovery=WINDOWS_SETTINGS
# Hosts ohne Proxy (Muster mit * erlaubt); Loopback ist immer ausgenommen.
network.proxy.nonProxyHosts=*.intern.example
# TLS: Java vertraut von sich aus nur seinem eigenen Truststore (cacerts), nicht dem Zertifikatspeicher des
# Systems. true (Standard): unter Windows gelten zusätzlich die Windows-Stammzertifikate (Windows-ROOT), damit
# Firmen-Proxys mit eigenem Zertifikat und Wurzeln, die einem älteren Java fehlen, wie in PowerShell funktionieren.
network.tls.useWindowsCertificateStore=true
# Optional: PEM- oder DER-Datei mit weiteren CA-Zertifikaten (z. B. das Zertifikat des Firmen-Proxys), die
# zusätzlich zu JVM- und Windows-Speicher gelten.
#network.tls.caCertificatesFile=C:/Zertifikate/firmen-ca.pem

# --- Agent-Modus (ACP) --------------------------------------------------------------------------------------
# false: nur Chat. true: Reiter "Agent"; der Agentenprozess bekommt je Start einen eigenen MCP-Endpoint mit Token
# über die Umgebungsvariablen ENTERPRISE_AI_MCP_*.
agent.enabled=false
# Kommando und Argumente (Shell-ähnlich, Anführungszeichen erlaubt), z. B. der Demo-Agent:
#agent.command=java
#agent.args=-jar "C:/Programme/enterprise-ai-client/acp-demo-agent-all.jar"
agent.requestTimeoutSeconds=30
agent.mcpEndpointId=agent-tools
agent.mcpDisplayName=Wissenswerkzeuge
# Grenzen der Wissenswerkzeuge search_knowledge / get_knowledge_document / refresh_knowledge_source (AP20):
# Zeichen je Antwort, Zeichen je Treffer-Ausschnitt, Treffer ohne Angabe (höchstens retrieval.maxResults),
# aufgezählte Fehler je Aktualisierung.
agent.tools.maxResponseChars=20000
agent.tools.snippetChars=600
agent.tools.defaultMaxResults=5
agent.tools.maxFailuresListed=20
