apply plugin: 'application'

description = 'Swing-Desktop-Anwendung und einzige Composition Root (Strang B, AP23).'

application {
    mainClass = 'com.aresstack.enterpriseai.app.EnterpriseAiClientMain'
}

dependencies {
    implementation project(':application')
    implementation project(':comic-controls')
    implementation project(':chat-openai')
    implementation project(':embedding-openai')
    implementation project(':knowledge-lucene')
    implementation project(':source-mediawiki')
    implementation project(':source-confluence')
    implementation project(':security-keepassrpc')
    implementation project(':acp-solon-client')
    implementation project(':mcp-solon-runtime')

    // Strang A: skriptbarer Fake-ChatCompletionPort für UI-Tests und die Demo.
    testImplementation testFixtures(project(':chat-api'))
}

tasks.withType(Test).configureEach {
    // Swing-Tests laufen ohne Display (CI); Fenster werden nur in der Demo erzeugt.
    systemProperty 'java.awt.headless', 'true'
}

tasks.register('runChatDemo', JavaExec) {
    group = 'application'
    description = 'Startet die Comic-Chat-Shell (AP4) mit einem Fake-Backend, ohne Server.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.aresstack.enterpriseai.app.chat.ChatShellDemo'
}
