// Gemeinsame Build-Konfiguration für alle Module (Java 8).
// Modulspezifische Abhängigkeiten stehen ausschließlich im build.gradle des jeweiligen Moduls;
// externe Versionen sind zentral in gradle/libs.versions.toml deklariert.

// Version: projectVersion (MAJOR.MINOR.PATCH) aus gradle.properties. Ohne -Prelease=true entsteht die
// Snapshot-Version <projectVersion>-SNAPSHOT; die CI setzt die Eigenschaft nur für Builds auf main
// (.github/workflows/release.yml). -PbuildCommit=<sha> trägt den Commit ins Manifest des Fat Jars ein
// (gradle/fat-jar.gradle).
def baseVersion = (rootProject.findProperty('projectVersion') ?: '').toString().trim()
if (!(baseVersion ==~ /\d+\.\d+\.\d+/)) {
    throw new GradleException("projectVersion in gradle.properties muss MAJOR.MINOR.PATCH sein, ist aber '${baseVersion}'")
}
def releaseBuild = 'true' == (rootProject.findProperty('release') ?: 'false').toString().trim()

allprojects {
    group = 'com.aresstack.enterpriseai'
    version = releaseBuild ? baseVersion : baseVersion + '-SNAPSHOT'
}

subprojects {
    apply plugin: 'java-library'

    java {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        // Auf JDK 9+ gegen die Java-8-Plattform-API kompilieren, damit Java-9+-APIs
        // (List.of, String.isBlank, java.net.http, ...) schon beim Kompilieren scheitern.
        if (JavaVersion.current().isJava9Compatible()) {
            options.release.set(8)
        }
        options.compilerArgs.addAll(['-Xlint:all', '-Xlint:-options', '-Xlint:-processing', '-Xlint:-serial'])
    }

    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
    }

    dependencies {
        testImplementation libs.junit
    }

    tasks.withType(Test).configureEach {
        useJUnit()
        testLogging {
            events = ['failed', 'skipped']
            exceptionFormat = 'full'
        }
    }
}
